name: SAST fixpoint diagnostics

on:
  workflow_dispatch:
  push:
    branches: [qualification/postgresql-only-20261023]
    paths:
      - '.github/workflows/sast-diagnostic.yml'
      - 'scripts/security/diagnose_sast_fixpoints.py'
      - 'scripts/security/test_sast_diagnostic.py'
      - 'scripts/security/diagnose_opengrep.py'
      - 'scripts/security/test_opengrep_diagnostic.py'

permissions:
  contents: read

concurrency:
  group: sast-diagnostic-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  SEMGREP_SEND_METRICS: 'off'
  SEMGREP_ENABLE_VERSION_CHECK: '0'

jobs:
  fixpoint-diagnostic:
    name: Diagnose only; no security gate approval
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - name: Install the same hash-locked scanner and immutable rules as security CI
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/security/requirements.txt
          python scripts/security/install_tools.py --tool rules --directory "$RUNNER_TEMP/sast-diagnostic-tools"
      - name: Test diagnostic completeness and publication boundaries
        run: |
          python -m unittest discover -s scripts/security -p 'test_sast_diagnostic.py' -v
          python -m unittest discover -s scripts/security -p 'test_opengrep_diagnostic.py' -v
      - name: Run bounded experiments with exact complete source files
        run: python scripts/security/diagnose_opengrep.py --root . --tools "$RUNNER_TEMP/sast-diagnostic-tools" --output "$RUNNER_TEMP/sast-diagnostic-private"
      - name: Seal private diagnostic evidence
        if: always()
        run: |
          mkdir "$RUNNER_TEMP/sast-diagnostic-public"
          node scripts/security/seal-evidence.cjs "$RUNNER_TEMP/sast-diagnostic-private" "$RUNNER_TEMP/sast-diagnostic-public/private-evidence.gpe" .github/security-evidence-public-key.pem
      - name: Bind the separate diagnostic upload set
        id: prepare-upload
        if: always()
        run: python scripts/security/diagnose_sast_fixpoints.py --publish --output "$RUNNER_TEMP/sast-diagnostic-private" --public "$RUNNER_TEMP/sast-diagnostic-public" --key .github/security-evidence-public-key.pem
      - name: Preserve sealed diagnostics and bounded metadata
        id: upload
        if: always() && steps.prepare-upload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sast-diagnostic-public/diagnostic-summary.json
            ${{ runner.temp }}/sast-diagnostic-public/private-evidence.gpe
            ${{ runner.temp }}/sast-diagnostic-public/diagnostic-upload-manifest.json
          if-no-files-found: error
          retention-days: 14
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Require artifact identity and archive digest
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: python scripts/security/prepare_upload.py --uploaded-receipt
