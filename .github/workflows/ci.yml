name: Grabenplaner checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-provider-node-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare separately pinned historical test dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --no-global-search-paths test-support/prepare-legacy-dependencies.cjs \
            --target "$RUNNER_TEMP/gp-legacy-dependencies" --pnpm "$(command -v pnpm)" \
            > "$RUNNER_TEMP/gp-legacy-dependencies-receipt.json"
          node -e 'const fs=require("node:fs"),path=require("node:path"),assert=require("node:assert/strict");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));assert.equal(r.root,path.join(process.env.RUNNER_TEMP,"gp-legacy-dependencies"));assert.match(r.manifestSha256,/^[a-f0-9]{64}$/);fs.appendFileSync(process.env.GITHUB_ENV,"GP_LEGACY_DEPENDENCIES_ROOT="+r.root+"\nGP_LEGACY_DEPENDENCIES_MANIFEST_SHA256="+r.manifestSha256+"\n");' "$RUNNER_TEMP/gp-legacy-dependencies-receipt.json"
      - name: PostgreSQL-only configuration, runtime boundary and legacy recovery on minimum Node
        run: >-
          node --test --test-concurrency=1
          test/v087-persistence-provider-contract.test.js
          test/postgresql-only-runtime.test.js
          test/postgresql-only-catalog-boundary.test.js
          test/postgresql-only-recovery.test.js
          test/postgresql-only-install-preflight.test.js
          test/legacy-recovery-capsule.test.js
          test/legacy-recovery-loader.test.js
          test/legacy-dependency-supply.test.js
          test/portal-foundation-legacy-migration.test.js
          test/runtime-v6-transition.test.js
          test/runtime-v6-frozen-dependencies.test.js
          test/runtime-v6-timer-fencing.test.js
          test/security-body-parser-trailing-bytes.test.js
          test/security-msal-auth-code-backport.test.js
          test/security-msal-auth-reachability.test.js
          test/security-ci-patch-policy.test.js
          test/security-ci-msal-patch-policy.test.js
          test/preflight-root-environment.test.js
          test/runtime-root-environment.test.js
          test/postgresql-operations-pure-preflight.test.js
          test/database-lock.test.js
          test/passkey-protocol.test.js
          test/passkey-key-policy.test.js
          test/passkey-management.test.js
          test/passkey-authentication.test.js
          test/passkey-application-context.test.js
          test/passkeys-persistence.test.js
          test/passkeys-migration.test.js
          test/passkeys-browser-tooling.test.js
          test/passkeys-browser-sandbox-location.test.js
      - name: Verify application and root maintenance lock transitions
        run: sudo "$(command -v node)" --test --test-name-pattern='root maintenance' test/database-lock.test.js
      - name: Verify original package binding and the root build-account boundary
        run: sudo "$(command -v node)" --test test/linux-build-tree-seal.test.js
      - name: Verify migration backups preserve existing points under the actual kernel lease
        run: sudo "$(command -v node)" --test test/postgresql-backup-preserve-shell.test.js

  postgresql-provider-development-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    env:
      APPLICATION_TEST_SHARD: ${{ matrix.shard }}
      TEST_POSTGRESQL_URL: postgresql://postgres:postgres@127.0.0.1:5432/grabenplaner_test
      TEST_POSTGRESQL_BIN: /usr/lib/postgresql/18/bin
      GP_PG_API_FIXTURE_BRIDGE: '1'
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grabenplaner_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grabenplaner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare separately pinned historical test dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --no-global-search-paths test-support/prepare-legacy-dependencies.cjs \
            --target "$RUNNER_TEMP/gp-legacy-dependencies" --pnpm "$(command -v pnpm)" \
            > "$RUNNER_TEMP/gp-legacy-dependencies-receipt.json"
          node -e 'const fs=require("node:fs"),path=require("node:path"),assert=require("node:assert/strict");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));assert.equal(r.root,path.join(process.env.RUNNER_TEMP,"gp-legacy-dependencies"));assert.match(r.manifestSha256,/^[a-f0-9]{64}$/);fs.appendFileSync(process.env.GITHUB_ENV,"GP_LEGACY_DEPENDENCIES_ROOT="+r.root+"\nGP_LEGACY_DEPENDENCIES_MANIFEST_SHA256="+r.manifestSha256+"\n");' "$RUNNER_TEMP/gp-legacy-dependencies-receipt.json"
      - name: Install PostgreSQL 18 client tools from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          if [ "$APPLICATION_TEST_SHARD" = '1/3' ]; then
            sudo install -d /etc/postgresql-common
            printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get install -y --no-install-recommends postgresql-18
          fi
      - name: Prepare separately frozen native Passkey browser tools
        if: matrix.shard == '1/3'
        shell: bash
        run: |
          set -euo pipefail
          python3 test-support/passkeys-browser/test_sandbox.py
          node test-support/passkeys-browser/prepare.cjs \
            --target "$RUNNER_TEMP/gp-passkeys-browser" --pnpm "$(command -v pnpm)" \
            > "$RUNNER_TEMP/gp-passkeys-browser-receipt.json"
          node "$RUNNER_TEMP/gp-passkeys-browser/node_modules/playwright/cli.js" install-deps chromium
          sudo python3 test-support/passkeys-browser/install-sandbox.py \
            --source "$RUNNER_TEMP/gp-passkeys-browser/browsers/chromium-1248/chrome-linux64/chrome_sandbox" \
            > "$RUNNER_TEMP/gp-passkeys-browser-sandbox.json"
          node test-support/passkeys-browser/write-ci-environment.cjs \
            "$RUNNER_TEMP/gp-passkeys-browser-receipt.json" "$RUNNER_TEMP/gp-passkeys-browser-sandbox.json"
      - name: PostgreSQL Blocks 5 and 6 development contract
        run: >-
          node --test --test-concurrency=1
          test/v087-database-block5-postgresql-provider.test.js
          test/v087-database-block5-postgresql-pool-policy.test.js
          test/v087-database-block5-postgresql-dialect-compiler.test.js
          test/v087-database-block5-postgresql-application-dialect-plan.test.js
          test/v087-database-block5-postgresql-catalog-contract.test.js
          test/v087-database-block5-postgresql-ui-preferences.test.js
          test/v087-database-block5-postgresql-planning-settings.test.js
          test/v087-database-block5-postgresql-organization-departments.test.js
          test/v087-database-block5-postgresql-system-center-metrics.test.js
          test/v087-database-block5-postgresql-migration-adapter.test.js
          test/v087-database-block5-postgresql-live.test.js
          test/v087-database-block6-backup-bundle.test.js
          test/v087-database-block6-mutation-quiesce.test.js
          test/v087-database-block6-operations-contract.test.js
          test/v087-database-block6-postgresql-backup.test.js
          test/v087-database-block6-postgresql-evidence.test.js
          test/v087-database-block6-postgresql-monitoring.test.js
          test/v087-database-block6-postgresql-restore.test.js
          test/v087-database-block6-postgresql-restore-live.test.js
          test/v087-database-block6-postgresql-snapshot.test.js
          test/v087-database-block6-postgresql-tools.test.js
          test/v087-database-block6-recovery-assurance.test.js
          test/v087-database-block6-no-cutover.test.js
      - name: Full application suite with native PostgreSQL fixtures
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--full --application-shard "$APPLICATION_TEST_SHARD")
          if [ "$APPLICATION_TEST_SHARD" = '1/3' ]; then arguments+=(--passkeys-browser); fi
          node test-support/postgresql-migration/ci-stock-import-delete.js "${arguments[@]}"

  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        name: Linux server scripts syntax
        run: find server-tools/linux -type f \( -name '*.sh' -o -name '*.sh.in' \) -print0 | xargs -0 -n1 bash -n
      - name: Native root deployment preflight dependency links
        run: sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 "$(command -v node)" --no-global-search-paths --test --test-concurrency=1 test/preflight-root-dependency-links.test.js
      - name: Native root runtime transition dependencies
        run: sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 "$(command -v node)" --no-global-search-paths --test --test-concurrency=1 test/runtime-v6-root-dependency-topology.test.js
      - name: Reboot module maintenance rollback (isolated temporary files)
        run: sudo python3 test/reboot-module-maintenance.test.py

  application-gates:
    if: always()
    needs: [postgresql-provider-node-minimum, postgresql-provider-development-contract, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every application qualification job to succeed
        env:
          MINIMUM: ${{ needs.postgresql-provider-node-minimum.result }}
          POSTGRESQL: ${{ needs.postgresql-provider-development-contract.result }}
          LINUX: ${{ needs.test.result }}
        run: |
          for result in "$MINIMUM" "$POSTGRESQL" "$LINUX"; do
            test "$result" = success || { echo 'A mandatory application qualification did not succeed.'; exit 1; }
          done
