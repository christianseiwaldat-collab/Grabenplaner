name: PostgreSQL API diagnostic

on:
  workflow_dispatch:
  push:
    branches: [qualification/postgresql-api-diagnostic-20261024]

permissions:
  contents: read

# Bounded fault diagnosis against fresh synthetic databases. This workflow is
# deliberately separate from, and cannot satisfy, application-gates.
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [foundations, rights, sales, next-rights, reports, loans]
    env:
      TEST_POSTGRESQL_URL: postgresql://postgres:postgres@127.0.0.1:5432/grabenplaner_test
      TEST_POSTGRESQL_BIN: /usr/lib/postgresql/18/bin
      GP_PG_API_FIXTURE_BRIDGE: '1'
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grabenplaner_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grabenplaner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare immutable historical dependencies for rights migration cases
        shell: bash
        run: |
          set -euo pipefail
          node --no-global-search-paths test-support/prepare-legacy-dependencies.cjs \
            --target "$RUNNER_TEMP/gp-legacy-dependencies" --pnpm "$(command -v pnpm)" \
            > "$RUNNER_TEMP/gp-legacy-dependencies-receipt.json"
          node -e 'const fs=require("node:fs"),path=require("node:path"),assert=require("node:assert/strict");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));assert.equal(r.root,path.join(process.env.RUNNER_TEMP,"gp-legacy-dependencies"));assert.match(r.manifestSha256,/^[a-f0-9]{64}$/);fs.appendFileSync(process.env.GITHUB_ENV,"GP_LEGACY_DEPENDENCIES_ROOT="+r.root+"\nGP_LEGACY_DEPENDENCIES_MANIFEST_SHA256="+r.manifestSha256+"\n");' "$RUNNER_TEMP/gp-legacy-dependencies-receipt.json"
      - name: Install PostgreSQL 18 client tools from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
      - name: Run bounded PostgreSQL API diagnosis
        env:
          DIAGNOSTIC_GROUP: ${{ matrix.group }}
        run: node test-support/postgresql-migration/ci-stock-import-delete.js --diagnostic-api "$DIAGNOSTIC_GROUP"
