name: SAST syntax diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - name: Install the pinned upstream wrapper and immutable rules
        run: |
          python -m venv "$RUNNER_TEMP/syntax-venv"
          "$RUNNER_TEMP/syntax-venv/bin/python" scripts/security/install_semgrep_runtime.py --root .
          echo "$RUNNER_TEMP/syntax-venv/bin" >> "$GITHUB_PATH"
          python scripts/security/install_tools.py --tool rules --directory "$RUNNER_TEMP/syntax-tools"
      - name: Verify parser diagnostics stay fail-closed and never approve SAST
        run: python -m unittest discover -s scripts/security -p 'test_syntax_diagnostic.py' -v
      - name: Parse every own target and inventory three syntactic rules
        run: python scripts/security/syntax_diagnostic.py --root . --tools "$RUNNER_TEMP/syntax-tools" --output "$RUNNER_TEMP/syntax-results"
      - name: Seal diagnostic findings for private review
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/syntax-public"
          node scripts/security/seal-evidence.cjs "$RUNNER_TEMP/syntax-results" "$RUNNER_TEMP/syntax-public/private-evidence.gpe" .github/security-evidence-public-key.pem
      - name: Preserve encrypted diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntax-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/syntax-public/private-evidence.gpe
          if-no-files-found: error
          retention-days: 7
          archive: true
          overwrite: false
          include-hidden-files: false
