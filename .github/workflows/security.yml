name: Grabenplaner security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  SEMGREP_SEND_METRICS: 'off'
  SEMGREP_ENABLE_VERSION_CHECK: '0'
  SYFT_CHECK_FOR_APP_UPDATE: 'false'

jobs:
  security-sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - name: Install exact production dependency graph
        run: pnpm install --prod --frozen-lockfile --config.node-linker=hoisted --package-import-method=copy
      - name: Install verified osv-scanner
        run: python scripts/security/install_tools.py --tool osv-scanner --directory "$RUNNER_TEMP/security-tools"
      - name: Fail-closed security gate contract tests
        run: python -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Exact compatibility-patch negative tests
        run: node --test test/security-ci-patch-policy.test.js test/security-ci-msal-patch-policy.test.js test/security-evidence-seal.test.js
      - name: Run sca gate
        run: python scripts/security/gates.py sca --root . --tools "$RUNNER_TEMP/security-tools" --output "$RUNNER_TEMP/security-results"
      - name: Prepare sanitized public metadata
        if: always()
        run: python scripts/security/publish_artifacts.py --gate sca --input "$RUNNER_TEMP/security-results" --output "$RUNNER_TEMP/security-public"
      - name: Seal private scanner evidence
        if: always()
        run: node scripts/security/seal-evidence.cjs "$RUNNER_TEMP/security-results" "$RUNNER_TEMP/security-public/private-evidence.gpe" .github/security-evidence-public-key.pem
      - name: Verify exact upload set and bind source/run hashes
        id: prepare-upload
        if: always()
        run: python scripts/security/prepare_upload.py --gate sca --input "$RUNNER_TEMP/security-results" --public "$RUNNER_TEMP/security-public" --key .github/security-evidence-public-key.pem
      - name: Preserve sanitized security receipts
        id: upload
        if: always() && steps.prepare-upload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-sca-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-public/gate-summary.json
            ${{ runner.temp }}/security-public/private-evidence.gpe
            ${{ runner.temp }}/security-public/upload-manifest.json
          if-no-files-found: error
          retention-days: 14
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Require artifact identity and archive digest
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: python scripts/security/prepare_upload.py --uploaded-receipt

  security-sast:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    # Reuse requires an externally reviewed exact-input compiler pin; otherwise
    # build cold. Current qualification and all five full profiles always run.
    # Scanner rule/wall limits and incomplete-analysis failures stay unchanged.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install hash-locked Semgrep and immutable upstream rules
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-source-venv"
          "$RUNNER_TEMP/semgrep-source-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/security/requirements.txt
          "$RUNNER_TEMP/semgrep-source-venv/bin/python" scripts/security/install_tools.py --tool rules --directory "$RUNNER_TEMP/security-tools"
          "$RUNNER_TEMP/semgrep-source-venv/bin/python" scripts/security/install_tools.py --tool syft --directory "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/semgrep-source-venv/bin" >> "$GITHUB_PATH"
      - name: Fail-closed security gate contract tests
        run: python -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Check private SAST context evidence contracts
        run: node --test test/security-sast-context-evidence.test.js test/security-sast-reviews.test.js
      - name: Acquire the reviewed compiler or build cold, then qualify current whole files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/security/build_semgrep_source.py --root .
          --tools "$RUNNER_TEMP/security-tools" --work "$RUNNER_TEMP/security-source-core-work"
          --output "$RUNNER_TEMP/security-source-core-qualification"
      - name: Bind raw qualification and actual private core before the full scan
        if: always()
        run: >-
          python scripts/security/prepare_source_core.py --root .
          --qualification "$RUNNER_TEMP/security-source-core-qualification"
          --output "$RUNNER_TEMP/security-results"
      - name: Run sast gate
        run: python scripts/security/gates.py sast --root . --tools "$RUNNER_TEMP/security-tools" --output "$RUNNER_TEMP/security-results"
      - name: Verify response rule with actual route and unsafe controls
        if: success() || failure()
        run: python scripts/security/check_payroll_response.py --root . --tools "$RUNNER_TEMP/security-tools" --output "$RUNNER_TEMP/security-results"
      - name: Bind private review contexts to the successful current SAST gate
        run: >-
          node scripts/security/sast-context-evidence.cjs capture --root .
          --gate "$RUNNER_TEMP/security-results/gate-result.json"
          --output "$RUNNER_TEMP/security-results/sast-context-evidence.json"
      - name: Prepare sanitized public metadata
        if: always()
        run: python scripts/security/publish_artifacts.py --gate sast --input "$RUNNER_TEMP/security-results" --output "$RUNNER_TEMP/security-public"
      - name: Seal private scanner evidence
        if: always()
        run: node scripts/security/seal-evidence.cjs "$RUNNER_TEMP/security-results" "$RUNNER_TEMP/security-public/private-evidence.gpe" .github/security-evidence-public-key.pem
      - name: Verify exact upload set and bind source/run hashes
        id: prepare-upload
        if: always()
        run: python scripts/security/prepare_upload.py --gate sast --input "$RUNNER_TEMP/security-results" --public "$RUNNER_TEMP/security-public" --key .github/security-evidence-public-key.pem
      - name: Preserve sanitized security receipts
        id: upload
        if: always() && steps.prepare-upload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-sast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-public/gate-summary.json
            ${{ runner.temp }}/security-public/private-evidence.gpe
            ${{ runner.temp }}/security-public/upload-manifest.json
          if-no-files-found: error
          retention-days: 14
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Require artifact identity and archive digest
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: python scripts/security/prepare_upload.py --uploaded-receipt

  security-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install verified gitleaks
        run: python scripts/security/install_tools.py --tool gitleaks --directory "$RUNNER_TEMP/security-tools"
      - name: Fail-closed security gate contract tests
        run: python -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Run secrets gate
        run: python scripts/security/gates.py secrets --root . --tools "$RUNNER_TEMP/security-tools" --output "$RUNNER_TEMP/security-results"
      - name: Prepare sanitized public metadata
        if: always()
        run: python scripts/security/publish_artifacts.py --gate secrets --input "$RUNNER_TEMP/security-results" --output "$RUNNER_TEMP/security-public"
      - name: Seal private scanner evidence
        if: always()
        run: node scripts/security/seal-evidence.cjs "$RUNNER_TEMP/security-results" "$RUNNER_TEMP/security-public/private-evidence.gpe" .github/security-evidence-public-key.pem
      - name: Verify exact upload set and bind source/run hashes
        id: prepare-upload
        if: always()
        run: python scripts/security/prepare_upload.py --gate secrets --input "$RUNNER_TEMP/security-results" --public "$RUNNER_TEMP/security-public" --key .github/security-evidence-public-key.pem
      - name: Preserve sanitized security receipts
        id: upload
        if: always() && steps.prepare-upload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-public/gate-summary.json
            ${{ runner.temp }}/security-public/private-evidence.gpe
            ${{ runner.temp }}/security-public/upload-manifest.json
          if-no-files-found: error
          retention-days: 14
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Require artifact identity and archive digest
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: python scripts/security/prepare_upload.py --uploaded-receipt

  security-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - name: Install exact production dependency graph
        run: pnpm install --prod --frozen-lockfile --config.node-linker=hoisted --package-import-method=copy
      - name: Install verified syft
        run: python scripts/security/install_tools.py --tool syft --directory "$RUNNER_TEMP/security-tools"
      - name: Fail-closed security gate contract tests
        run: python -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Native inventory Linux positive and negative tests
        run: node --test test/security-release-inventory.test.js test/security-release-host-inventory.test.js test/security-release-inventory-host-cli.test.js
      - name: Run sbom gate
        run: python scripts/security/gates.py sbom --root . --tools "$RUNNER_TEMP/security-tools" --output "$RUNNER_TEMP/security-results"
      - name: Prepare sanitized public metadata
        if: always()
        run: python scripts/security/publish_artifacts.py --gate sbom --input "$RUNNER_TEMP/security-results" --output "$RUNNER_TEMP/security-public"
      - name: Seal private scanner evidence
        if: always()
        run: node scripts/security/seal-evidence.cjs "$RUNNER_TEMP/security-results" "$RUNNER_TEMP/security-public/private-evidence.gpe" .github/security-evidence-public-key.pem
      - name: Verify exact upload set and bind source/run hashes
        id: prepare-upload
        if: always()
        run: python scripts/security/prepare_upload.py --gate sbom --input "$RUNNER_TEMP/security-results" --public "$RUNNER_TEMP/security-public" --key .github/security-evidence-public-key.pem
      - name: Preserve sanitized security receipts
        id: upload
        if: always() && steps.prepare-upload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-public/gate-summary.json
            ${{ runner.temp }}/security-public/private-evidence.gpe
            ${{ runner.temp }}/security-public/upload-manifest.json
            ${{ runner.temp }}/security-public/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Require artifact identity and archive digest
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: python scripts/security/prepare_upload.py --uploaded-receipt

  security-gates:
    if: always()
    needs: [security-sca, security-sast, security-secrets, security-sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every security job to succeed
        env:
          SCA: ${{ needs.security-sca.result }}
          SAST: ${{ needs.security-sast.result }}
          SECRETS: ${{ needs.security-secrets.result }}
          SBOM: ${{ needs.security-sbom.result }}
        run: |
          for result in "$SCA" "$SAST" "$SECRETS" "$SBOM"; do
            test "$result" = success || { echo 'A mandatory security gate did not succeed.'; exit 1; }
          done
