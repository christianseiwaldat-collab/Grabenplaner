name: Core deploy transition checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-deploy-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the corrected migration and Offsite admission with exact Core evidence
        run: >-
          node --test --test-concurrency=1
          test/core-deploy-proof.test.js
          test/core-deploy-offsite-status.test.js
          test/postgresql-migration-core-backup.test.js
          test/postgresql-session-security-cli.test.js
          test/postgresql-deploy-owned-bundle.test.js
          test/postgresql-deploy-owned-orchestration.test.js
          test/deploy-owned-policy.test.js
      - name: Check the installed operational shell
        run: bash -n server-tools/linux/test-grabenplaner-server.sh
      - name: Verify the real kernel maintenance lease without rotating earlier backup points
        run: sudo "$(command -v node)" --no-global-search-paths --test test/postgresql-backup-preserve-shell.test.js
