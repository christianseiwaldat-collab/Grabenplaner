<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Bewerbung bewerten · Grabenplaner</title>
  <link rel="stylesheet" href="/candidate-evaluation.css" />
  <script src="/candidate-evaluation.js" defer></script>
</head>
<body>
  <main class="evaluation-shell" aria-labelledby="evaluationTitle">
    <section class="evaluation-panel">
      <header class="evaluation-heading">
        <span class="evaluation-mark" aria-hidden="true">GP</span>
        <div>
          <p class="evaluation-eyebrow">Strukturierte Rückmeldung</p>
          <h1 id="evaluationTitle">Bewerbung bewerten</h1>
          <p>Bitte jedes Kriterium mit ein bis fünf Sternen bewerten und bei Bedarf sachlich kommentieren.</p>
        </div>
      </header>
      <p class="evaluation-status" id="evaluationStatus" role="status" aria-live="polite">Bewertung wird geladen.</p>
      <div id="evaluationContent" aria-live="polite">
        <div class="evaluation-loading">Einen Moment bitte …</div>
      </div>
    </section>
  </main>
</body>
</html>
